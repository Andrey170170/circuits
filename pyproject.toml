[project]
name = "circuits"
version = "0.0.2"
description = "Circuits discovery and evaluation"

requires-python = "==3.12.*"
dependencies = [
    "util",
    "env_util",
    "neurondb",
    "user_modeling",
    "anthropic>=0.72.0",
    "openai>=2.11.0",
    "wandb>=0.19.6",
    "jupyter>=1.0.0",
    "statsmodels>=0.14.0",
    "jupyter-collaboration>=1.2.0",
    "vllm==0.7.3",
    "treescope>=0.1.9",
    "together>=1.5.7",
    "peft>=0.15.0",
    "pyvene>=0.1.8",
    "plotnine",
    "dictionary_learning",
    "graphviz",
    "nnsight<0.4.0",
    "sae_lens @ git+https://github.com/aryamanarora/SAELens.git",
    "torch==2.5.1",
    "tabulate>=0.9.0",
    "sentence-transformers",
]

[dependency-groups]
dev = [
    "pytest==9.0.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "ruff==0.16.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "ty==0.0.65; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["circuits"]

[tool.ruff]
required-version = "==0.16.1"
target-version = "py312"
line-length = 88
preview = false
src = ["circuits", "lib", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "DTZ",
    "LOG",
    "PERF",
    "PIE",
    "PLE",
    "PLC",
    "PT",
    "RET",
    "RUF",
    "SIM",
]
ignore = [
    "E741",  # Legacy scientific code uses I/l/O as established dimension and index names.
    "PLC0415",  # Lazy imports keep optional and GPU-heavy dependencies out of startup paths.
    "RUF001",  # Scientific text intentionally contains Unicode symbols.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"circuits/analysis/bonafide/clustering_evaluation.py" = [
    "UP035",  # Byte-hashed frozen implementation; preserve artifact compatibility.
]
"circuits/tracing/artifact.py" = ["UP035", "UP017", "TRY004"]
"circuits/tracing/candidate_union.py" = [
    "UP035",
    "UP017",
    "B905",  # Byte-hashed frozen implementation; preserve exact source bytes.
]
"scripts/steering.py" = ["ALL"]  # Stale notebook prototype; not an executable module.
"tests/**/*.py" = ["B011"]

[tool.ty.environment]
python-version = "3.12"
python-platform = "linux"

[tool.ty.src]
include = [
    "circuits/analysis/bonafide",
    "circuits/frontend",
    "circuits/labeling",
    "circuits/tracing",
    "scripts/bonafide",
]
exclude = [
    # Candidate identity authorization v1 byte-hashes this frozen implementation.
    "circuits/analysis/bonafide/candidate_profiles.py",
    # These dynamic tracing internals predate the typed artifact/provenance layer.
    "circuits/tracing/attribution.py",
    "circuits/tracing/clja.py",
    "circuits/tracing/grad/__init__.py",
    "circuits/tracing/trace.py",
    "circuits/tracing/utils.py",
]

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "error"
unused-type-ignore-comment = "error"

# Retain the broader editor configuration while the executable ty gate expands.
[tool.pyright]
strict = ["circuits"]
reportMissingTypeStubs = false

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
util = { path = "lib/util", editable = true }
env_util = { path = "lib/env_util", editable = true }
neurondb = { path = "lib/neurondb", editable = true }
user_modeling = { path = "lib/user_modeling", editable = true }

[tool.uv]
# This experiment fork is run on CHPC Linux x86_64. Restricting the lock target
# avoids evaluating the upstream macOS-only vLLM source build on CPU nodes.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
